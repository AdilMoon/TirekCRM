services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tirek
      POSTGRES_USER: tirek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tirek -d tirek"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
