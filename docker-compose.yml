name: tirekcrm-docker

x-app: &app
  image: tirekcrm-local:latest
  pull_policy: never
  init: true

x-database-url: &database-url "postgresql://tirek:${TIREK_DOCKER_DB_PASSWORD:?Run npm run docker:setup}@postgres:5432/tirek"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tirek
      POSTGRES_PASSWORD: ${TIREK_DOCKER_POSTGRES_PASSWORD:?Run npm run docker:setup}
      TIREK_APP_PASSWORD: ${TIREK_DOCKER_DB_PASSWORD:?Run npm run docker:setup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker-postgres-init.sh:/docker-entrypoint-initdb.d/tirek.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$TIREK_APP_PASSWORD\" psql -h 127.0.0.1 -U tirek -d tirek -tAc 'SELECT 1'"]
      interval: 5s
      timeout: 4s
      retries: 20

  migrate:
    <<: *app
    build: .
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: *database-url
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    command: ["node", "backend/dist/main.js"]
    environment:
      DATABASE_URL: *database-url
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      WEB_ORIGIN: "https://localhost:${TIREK_DOCKER_HTTPS_PORT:-9443}"
      REGISTRATION_ENABLED: "${TIREK_DOCKER_REGISTRATION_ENABLED:-true}"
      MAIL_DELIVERY: ${TIREK_DOCKER_MAIL_DELIVERY:-disabled}
      GMAIL_USER: ${TIREK_DOCKER_GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${TIREK_DOCKER_GMAIL_APP_PASSWORD:-}
      MAIL_ENCRYPTION_KEY: ${TIREK_DOCKER_MAIL_ENCRYPTION_KEY:-}
      TELEGRAM_DELIVERY: ${TIREK_DOCKER_TELEGRAM_DELIVERY:-disabled}
      TELEGRAM_BOT_TOKEN: ${TIREK_DOCKER_TELEGRAM_BOT_TOKEN:-}
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
    secrets: [metrics_token]
    networks: [default, database, monitoring]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    <<: *app
    restart: unless-stopped
    working_dir: /app/frontend
    command: ["node", "../node_modules/next/dist/bin/next", "start", "--hostname", "0.0.0.0", "--port", "3000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./scripts/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./scripts/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets: [metrics_token]
    networks: [monitoring, monitoring_access]
    depends_on:
      blackbox: {condition: service_started}

  grafana:
    image: grafana/grafana:13.3.1
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 512m
    ports: ["127.0.0.1:3100:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SERVER_ROOT_URL: http://localhost:3100/
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/grafana_secret_key
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    secrets: [grafana_password, grafana_secret_key]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./scripts/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./scripts/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring, monitoring_access]
    depends_on: [prometheus]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 96m
    command: ["--config.file=/etc/blackbox/config.yml"]
    volumes:
      - ./scripts/monitoring/blackbox.yml:/etc/blackbox/config.yml:ro
      - caddy_public_ca:/trust:ro
    networks: [default, monitoring]
    depends_on:
      ca-export: {condition: service_completed_successfully}

  ca-export:
    image: caddy:2-alpine
    profiles: [monitoring]
    network_mode: none
    entrypoint: ["/bin/sh", "/export-ca.sh"]
    volumes:
      - caddy_data:/source:ro
      - caddy_public_ca:/trust
      - ./scripts/monitoring/export-ca.sh:/export-ca.sh:ro
    depends_on: [caddy]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TIREK_DOCKER_HTTPS_PORT:-9443}:443"
    volumes:
      - ./scripts/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

networks:
  monitoring_access:
  monitoring:
    internal: true
  database:
    internal: true

volumes:
  caddy_public_ca:
  prometheus_data:
  grafana_data:
  postgres_data:
  caddy_data:

secrets:
  metrics_token:
    file: ./.local/monitoring/metrics-token
  grafana_password:
    file: ./.local/monitoring/grafana-password
  grafana_secret_key:
    file: ./.local/monitoring/grafana-secret-key
